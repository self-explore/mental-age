<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自我探索-真实心理年龄测试</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ==================== 封面 ==================== -->
  <div id="cover-page" class="screen active">
    <div class="cover">
      <div class="brand-bar"><span class="brand">自我探索-真实心理年龄测试</span></div>
      <div class="cover-inner">
        <h1 class="cover-h1">心理年龄测试</h1>
        <p class="cover-sub">你的身体在成长，但你的灵魂几岁了？</p>
        <p class="cover-desc">通过40道深度心理题，探索你潜意识里的真实年龄。</p>
        <button class="btn-main" onclick="show('birthday-page')">开始探索</button>
        <div class="cover-tags"><span>无需登录</span><span>即时结果</span></div>
      </div>
    </div>
  </div>

  <!-- ==================== 生日确认 ==================== -->
  <div id="birthday-page" class="screen">
    <div class="bd-wrap">
      <h2 class="bd-h2">首先，确认你的实际年龄</h2>
      <p class="bd-sub">我们需要它来计算心理年龄偏差值</p>
      <div class="bd-selects">
        <select id="sel-year"></select>
        <select id="sel-month"></select>
        <select id="sel-day"></select>
      </div>
      <button class="btn-main" onclick="enterQuiz()">进入测试</button>
      <p class="bd-note">你的生日信息仅用于本次测试计算，不会被存储。</p>
    </div>
  </div>

  <!-- ==================== 答题 ==================== -->
  <div id="quiz-page" class="screen">
    <div class="quiz-top">
      <div class="quiz-top-row">
        <span id="q-num">Question 1</span>
        <span id="q-total">40 total</span>
      </div>
      <div class="q-bar-wrap"><div class="q-bar" id="q-bar"></div></div>
    </div>
    <div class="quiz-body">
      <h3 class="q-text" id="q-text"></h3>
      <div class="q-opts" id="q-opts"></div>
    </div>
  </div>

  <!-- ==================== 加载 ==================== -->
  <div id="load-page" class="screen">
    <div class="load-wrap">
      <h2 class="load-h2">正在整理你的心理画像</h2>
      <p class="load-sub">系统正在计算你的心理年龄、原型角色与完整的人格分析，请稍候片刻。</p>
      <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
      <div class="load-pct" id="load-pct">0%</div>
      <div class="load-steps" id="load-steps"></div>
    </div>
  </div>

  <!-- ==================== 结果 ==================== -->
  <div id="result-page" class="screen">
    <div class="result-scroll" id="result-scroll"></div>
  </div>

  <script src="quiz-data.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
